# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L3, Z1 via quality.yml;
# na L1.5, L2, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L3 browsers/artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frogie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      package-manager: pnpm
      runtime-version: 11.6.0
      node-version: 26.12.1
      install-policy: project
      coverage-path: coverage/
      prepare-command: pnpm exec husky
      test-command: pnpm run test:coverage && pnpm run test:l1-gate
      security: true
      build: true
      build-command: pnpm run build
      workflow-lint: true
      workflow-lint-yamllint: true
      l3: true
      l3-browsers: chromium
      l3-prepare-command: pnpm run build
      l3-command: pnpm exec playwright test
      l3-artifact-name: browser-evidence
      l3-artifact-path: data/e2e/browser-results/
      l3-artifact-retention-days: 14
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "非 Cloudflare Worker 项目，无 workerd / vitest-pool-workers 运行时测试套件"},
        "L2": {"status": "na", "reason": "无独立 HTTP API E2E；daemon 在 Playwright 用例内启动，属 L3"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "根与 @frogie/core 均为 private，无 npm 发布与 package-check 脚本"},
        "Z1": {"status": "impl"}}
